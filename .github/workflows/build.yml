name: Build mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'
      - name: Build
        run: gradle build --no-daemon --stacktrace --console=plain
      - name: Forge server startup smoke test
        shell: bash
        run: |
          set -u
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 120s gradle runServer --no-daemon --stacktrace --console=plain > run-server.log 2>&1
          server_status=$?
          set -e
          cat run-server.log
          if ! grep -q 'Done (' run-server.log; then
            echo "Forge server did not reach the Done state (exit code: ${server_status})."
            exit 1
          fi
      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: machine-defence
          path: build/libs/*.jar
